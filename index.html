<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TICK · 선착순이 끝나는 곳</title>
<meta name="description" content="선착순 대신 추첨으로 티켓을 배정하는 서비스 디자인 콘셉트, TICK">
<meta property="og:title" content="TICK · 응원한 시간만큼 유리해지는 티케팅">
<meta property="og:description" content="선착순 대신 추첨으로 티켓을 배정하는 서비스 디자인 콘셉트">
<meta name="theme-color" content="#14121A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%2365558F%22/%3E%3Ctext x=%2232%22 y=%2243%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2230%22 fill=%22white%22 text-anchor=%22middle%22%3ET%3C/text%3E%3C/svg%3E">
<link id="font" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  TICK · 시안 B (다크 몰입형) — 한 파일 버전
  · 처음 열면 소개 페이지, 티켓 절취선을 뜯으면 같은 파일 안에서 프로토타입으로 바뀝니다.
  · 주소 끝에 ?app=1 을 붙이면 프로토타입이 바로 열립니다.
  · 스타일·마크업·스크립트가 [공통 토큰] / [소개 페이지] / [앱 프로토타입] 덩어리로 나뉘어 있어요.
-->
<style id="css-base">
/* ===== [공통 토큰] 색상 · 글꼴 · 리셋 ===== */
:root{--pri:#65558F;--pri-d:#4F4275;--sub:#F2EDFF;--onsub:#6E619A;--onpri:#D6CDF0;--bg:#F7F6F9;--sec:#fff;--tx:#34303D;--tx2:#8A8593;--tx3:#B5B1BE;--ln:#EDEBF1;--ln2:#E3E0E9;--ok:#1A6B5C;--okbg:#E4F1EE;--bd:#9B3244;--bdbg:#FAEAEE;
--font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font);color:var(--tx);-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== [공통] 화면 전환: 암흑 → 프로토타입이 입체적으로 서서히 ===== */
#xfade{position:fixed;inset:0;z-index:2000;pointer-events:none;visibility:hidden}
#xfade.on{visibility:visible;pointer-events:auto}
#xfade .veil{position:absolute;inset:0;background:#09080D;opacity:0}
#xfade.dark .veil{opacity:1;transition:opacity .75s cubic-bezier(.4,0,.2,1)}
#xfade.reveal .veil{opacity:0;transition:opacity 1.3s cubic-bezier(.4,0,.2,1)}
#xfade.notrans .veil{transition:none!important}
</style>
<style id="css-intro">
/* ===== [소개 페이지] 폰 프레임 ===== */
/* 소개 페이지 공용 폰 프레임 — 앱 화면(375×790, 원본 시안 크기)을 담음 */
.pf{--w:300px;width:var(--w);border-radius:calc(var(--w)*.1);background:#fff;padding:0;box-shadow:0 40px 90px rgba(52,48,61,.22);border:1px solid #DBD7E2;position:relative;flex:none;overflow:hidden}
.pf-s{width:100%;aspect-ratio:375/790;position:relative;overflow:hidden;background:#F7F6F9}
.pf-s iframe{position:absolute;top:0;left:0;width:375px;height:790px;border:0;transform-origin:0 0;display:block}

/* ===== [소개 페이지] 다크 몰입형 ===== */

:root{--d-bg:#14121A;--d-tx:#EDEAF3;--d-mu:#9A94A8;--d-pri:#B9A9EE;--d-ln:rgba(255,255,255,.1)}
body{background:var(--d-bg);color:var(--d-tx);overflow-x:hidden}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.top{position:absolute;top:0;left:0;right:0;z-index:5}
.top .wrap{height:72px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:24px;font-weight:760;letter-spacing:-.06em;color:var(--d-pri)}
.top a.sm{font-size:14px;font-weight:550;color:var(--d-mu)}
.top a.sm:hover{color:var(--d-tx)}

.hero{min-height:100vh;min-height:100svh;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:110px 0 80px}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(101,85,143,.55) 0%,rgba(101,85,143,.12) 40%,transparent 68%);top:50%;left:50%;transform:translate(-50%,-55%);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-55%) scale(1.08);opacity:.8}}
.float{position:absolute;width:120px;height:58px;border-radius:12px;background:linear-gradient(135deg,rgba(185,169,238,.22),rgba(185,169,238,.05));box-shadow:inset 0 0 0 1px rgba(185,169,238,.2);-webkit-mask:radial-gradient(circle at 0 50%,transparent 9px,#000 9.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 9px,#000 9.5px) right/51% 100% no-repeat;mask:radial-gradient(circle at 0 50%,transparent 9px,#000 9.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 9px,#000 9.5px) right/51% 100% no-repeat;animation:fl 14s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-26px) rotate(var(--r2))}}
.hero .in{position:relative;z-index:2}
.kicker{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--d-pri)}
.word{font-size:clamp(96px,19vw,260px);font-weight:820;letter-spacing:-.07em;line-height:.9;margin-top:18px;background:linear-gradient(180deg,#fff 20%,#B9A9EE 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1{font-size:clamp(22px,2.6vw,32px);font-weight:620;letter-spacing:-.03em;line-height:1.45;margin-top:26px}
.hero h1 em{font-style:normal;color:var(--d-pri)}
.hero p{font-size:16px;line-height:1.7;color:var(--d-mu);margin-top:14px}

/* 티켓 모양 CTA */
.tkt{display:inline-flex;margin-top:44px;cursor:pointer;filter:drop-shadow(0 18px 40px rgba(101,85,143,.5));transition:transform .25s cubic-bezier(.2,.8,.2,1);user-select:none;-webkit-user-select:none;text-align:left}
.tkt:hover{transform:translateY(-3px) rotate(-1deg)}
.tkt .main,.tkt .stub{background:linear-gradient(135deg,#8F7DCC,#65558F);height:84px;display:flex;flex-direction:column;justify-content:center}
.tkt .main{padding:0 30px 0 32px;border-radius:16px 0 0 16px;-webkit-mask:radial-gradient(circle at 100% 0,transparent 10px,#000 10.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,transparent 10px,#000 10.5px) bottom/100% 51% no-repeat;mask:radial-gradient(circle at 100% 0,transparent 10px,#000 10.5px) top/100% 51% no-repeat,radial-gradient(circle at 100% 100%,transparent 10px,#000 10.5px) bottom/100% 51% no-repeat}
.tkt .main b{font-size:20px;font-weight:680;color:#fff;letter-spacing:-.02em}
.tkt .main span{font-size:12px;color:#D6CDF0;margin-top:3px}
.tkt .stub{width:96px;align-items:center;border-radius:0 16px 16px 0;border-left:2px dashed rgba(255,255,255,.4);transform-origin:0 100%;-webkit-mask:radial-gradient(circle at 0 0,transparent 10px,#000 10.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,transparent 10px,#000 10.5px) bottom/100% 51% no-repeat;mask:radial-gradient(circle at 0 0,transparent 10px,#000 10.5px) top/100% 51% no-repeat,radial-gradient(circle at 0 100%,transparent 10px,#000 10.5px) bottom/100% 51% no-repeat}
.tkt .stub small{font-size:10px;font-weight:650;letter-spacing:.14em;color:#D6CDF0}
.tkt .stub b{font-size:22px;font-weight:760;color:#fff;letter-spacing:-.04em}
.tkt.tear .stub{animation:tear .7s cubic-bezier(.5,0,.6,1) forwards}
@keyframes tear{30%{transform:rotate(8deg) translate(4px,-2px)}100%{transform:rotate(38deg) translate(60px,180px);opacity:0}}
#flash{position:fixed;inset:0;z-index:100;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#D6CDF0 0%,#65558F 30%,#14121A 70%);clip-path:circle(0 at var(--x,50%) var(--y,50%))}
html.leaving #flash{transition:clip-path .75s .3s cubic-bezier(.7,0,.2,1);clip-path:circle(150% at var(--x,50%) var(--y,50%))}
.scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--d-mu);letter-spacing:.12em;z-index:2}
.scroll::after{content:'';display:block;width:1px;height:36px;background:linear-gradient(var(--d-mu),transparent);margin:10px auto 0;animation:sl 2s ease-in-out infinite}
@keyframes sl{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

section{padding:120px 0}
.lbl{font-size:12px;font-weight:650;letter-spacing:.14em;color:var(--d-pri)}
h2{font-size:clamp(32px,4.2vw,56px);line-height:1.15;font-weight:720;letter-spacing:-.045em;margin-top:16px}
h2 em{font-style:normal;color:var(--d-pri)}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:64px;border-top:1px solid var(--d-ln)}
.big div{padding:36px 26px 0 0}
.big div+div{padding-left:26px;border-left:1px solid var(--d-ln)}
.big .n{font-size:clamp(64px,8vw,112px);font-weight:800;letter-spacing:-.06em;line-height:1;background:linear-gradient(180deg,#fff,#8F7DCC);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.big .n small{font-size:.4em}
.big .t{font-size:16px;font-weight:600;line-height:1.5;margin-top:18px}
.big .s{font-size:12px;color:var(--d-mu);margin-top:10px;line-height:1.6}

.vs{margin-top:60px;border-radius:28px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--d-ln)}
.vs .r{display:grid;grid-template-columns:180px 1fr 1fr;border-top:1px solid var(--d-ln)}
.vs .r:first-child{border-top:0}
.vs .r>div{padding:22px 26px;font-size:16px;line-height:1.5}
.vs .r>div:first-child{color:var(--d-mu);font-size:14px;font-weight:600}
.vs .r>div:nth-child(2){color:var(--d-mu);text-decoration:line-through;text-decoration-color:rgba(154,148,168,.5)}
.vs .r>div:nth-child(3){background:rgba(101,85,143,.18);font-weight:600}
.vs .hd>div{font-size:13px!important;font-weight:650!important;letter-spacing:.06em;color:var(--d-mu)!important;text-decoration:none!important;padding-top:18px!important;padding-bottom:18px!important}
.vs .hd>div:nth-child(3){color:var(--d-pri)!important}

.preview{display:grid;grid-template-columns:1fr auto;gap:80px;align-items:center}
.preview p{font-size:17px;line-height:1.75;color:var(--d-mu);margin-top:20px;max-width:480px}
.preview ul{list-style:none;margin-top:28px;display:grid;gap:12px}
.preview li{display:flex;gap:12px;align-items:center;font-size:15px;font-weight:550}
.preview li i{width:8px;height:8px;border-radius:50%;background:var(--d-pri);flex:none}
.preview .pf{--w:300px;box-shadow:0 40px 100px rgba(101,85,143,.45),inset 0 0 0 2px #3A3741}

.final{text-align:center;padding:140px 0 160px;position:relative;overflow-x:clip;overflow-y:visible}
.final .glow{width:1100px;height:1100px;max-width:none;background:radial-gradient(circle,rgba(101,85,143,.5) 0%,rgba(101,85,143,.14) 32%,rgba(101,85,143,.04) 50%,transparent 62%);pointer-events:none}
.final .in{position:relative}
footer{border-top:1px solid var(--d-ln);padding:28px 0 40px;font-size:13px;color:#6E6879}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.rv{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

@media (max-width:900px){
 .preview{grid-template-columns:1fr;gap:50px}
 .preview .pf{margin:0 auto}
 .big{grid-template-columns:1fr}
 .big div,.big div+div{padding:30px 0;border-left:0;border-bottom:1px solid var(--d-ln)}
 .vs .r{grid-template-columns:1fr 1fr}
 .vs .r>div:first-child{grid-column:1/-1;padding-bottom:0}
 .vs .hd>div:first-child{display:none}
}
@media (max-width:560px){
 .wrap{padding:0 20px}
 section{padding:84px 0}
 .float{display:none}
 .tkt .main{padding:0 20px}
 .tkt .main b{font-size:17px}
 .tkt .stub{width:78px}
 .vs .r>div{padding:16px;font-size:14px}
}

body{overflow-x:hidden}
.hero.enter .in{animation:heroIn .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(18px)}}
.tkt .main{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tkt.tear .main{transform:scale(.97)}
/* ===== [소개 페이지] 상세 섹션 ===== */
html{scroll-behavior:smooth}
section[id]{scroll-margin-top:64px}
section.tight{padding-top:40px}
.lead{font-size:17px;line-height:1.75;color:var(--d-mu);margin-top:20px;max-width:560px}
.lead b,.dots b{color:var(--d-tx);font-weight:600}
h3{font-size:20px;font-weight:680;letter-spacing:-.03em;line-height:1.35}

/* 고정 내비 */
.snav{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(20,18,26,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--d-ln);transform:translateY(-100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.snav.on{transform:none}
.snav .wrap{height:60px;display:flex;align-items:center;gap:28px}
.snav .brand{font-size:20px}
.snav .links{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.snav .links::-webkit-scrollbar{display:none}
.snav .links a{flex:none;font-size:13px;font-weight:550;color:var(--d-mu);padding:7px 11px;border-radius:8px;transition:color .2s,background .2s}
.snav .links a:hover{color:var(--d-tx)}
.snav .links a.on{color:#fff;background:rgba(185,169,238,.16)}
.snav .go{flex:none;font-size:13px;font-weight:650;color:#fff;background:#65558F;padding:9px 16px;border-radius:10px}
.snav .go:hover{background:#7563A3}

/* 히어로 요약 */
.facts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:40px}
.facts span{font-size:13px;color:var(--d-mu);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--d-ln);border-radius:12px;padding:10px 14px;text-align:left}
.facts b{display:block;font-size:14px;color:var(--d-tx);font-weight:650;margin-bottom:2px}

/* 문제 장면 */
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:56px}
.scene{background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--d-ln);border-radius:22px;padding:28px}
.sn{font-size:12px;font-weight:650;color:var(--d-pri);letter-spacing:.06em}
.scene h3{margin-top:10px}
.scene p{font-size:15px;line-height:1.7;color:var(--d-mu);margin-top:10px}
.root{margin-top:22px;display:flex;gap:24px;align-items:flex-start;background:linear-gradient(120deg,rgba(101,85,143,.35),rgba(101,85,143,.08));border-radius:22px;padding:28px 30px}
.root .k{font-size:12px;font-weight:700;color:var(--d-pri);letter-spacing:.12em;flex:none;margin-top:5px}
.root p{font-size:19px;font-weight:600;line-height:1.6;letter-spacing:-.02em}
.root em{font-style:normal;color:var(--d-pri)}

/* 작동 방식 */
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:52px}
.pil{background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--d-ln);border-radius:22px;padding:26px 24px;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.pil:hover{transform:translateY(-5px);box-shadow:inset 0 0 0 1px rgba(185,169,238,.4)}
.pil .q{font-size:13px;font-weight:600;color:var(--d-mu)}
.pil h3{font-size:26px;margin-top:6px;background:linear-gradient(180deg,#fff,#C9BDF2);-webkit-background-clip:text;background-clip:text;color:transparent}
.pil p{font-size:15px;line-height:1.65;color:var(--d-mu);margin-top:12px;flex:1}
.chip{display:inline-block;align-self:flex-start;margin-top:18px;font-size:12px;font-weight:650;color:var(--d-pri);background:rgba(185,169,238,.12);border-radius:7px;padding:5px 9px}
.journey{margin-top:22px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--d-ln);border-radius:22px;padding:28px 28px 30px}
.jt{font-size:13px;font-weight:650;color:var(--d-pri);letter-spacing:.04em}
.journey ol{list-style:none;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:22px;counter-reset:j}
.journey li{position:relative;padding-top:30px;counter-increment:j}
.journey li::before{content:counter(j);position:absolute;top:0;left:0;width:22px;height:22px;border-radius:50%;background:#65558F;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;z-index:1}
.journey li::after{content:'';position:absolute;top:11px;left:22px;right:-10px;height:1px;background:linear-gradient(90deg,rgba(185,169,238,.6),rgba(185,169,238,.15))}
.journey li:last-child::after{display:none}
.journey b{display:block;font-size:15px;font-weight:650}
.journey span{display:block;font-size:12.5px;line-height:1.55;color:var(--d-mu);margin-top:4px}

/* 2열 + 계산기 */
.split{display:grid;grid-template-columns:1fr 440px;gap:72px;align-items:center}
.split.rev{grid-template-columns:440px 1fr}
.dots{list-style:none;margin-top:26px;display:grid;gap:12px}
.dots li{position:relative;padding-left:20px;font-size:15px;line-height:1.65;color:var(--d-mu)}
.dots li::before{content:'';position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--d-pri)}
.calc{background:linear-gradient(160deg,rgba(101,85,143,.3),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(185,169,238,.22);border-radius:26px;padding:28px}
.ch{font-size:12px;font-weight:650;color:var(--d-pri);letter-spacing:.06em}
.cl{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:15px;font-weight:600}
.cl b{font-size:30px;font-weight:780;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin-top:8px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#B9A9EE var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#B9A9EE var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 0 0 6px rgba(185,169,238,.3)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(185,169,238,.3)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(185,169,238,.7)}
.steps3,.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.steps3>div,.tiers>div{border-radius:14px;padding:12px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--d-ln);transition:all .25s}
.steps3 i{display:block;width:26px;height:16px;border-radius:4px;background:rgba(255,255,255,.14);margin-bottom:8px;transition:background .25s}
.steps3 b,.tiers b{display:block;font-size:15px;font-weight:680}
.steps3 span,.tiers span{display:block;font-size:12px;color:var(--d-mu);margin-top:2px}
.steps3>div.on,.tiers>div.on{background:rgba(185,169,238,.16);box-shadow:inset 0 0 0 1.5px rgba(185,169,238,.7)}
.steps3>div.on i{background:#B9A9EE}

/* 주최 측 설정 슬라이더 */
.hr-wrap{position:relative;height:28px}
.hr-rec{position:absolute;top:10px;height:8px;left:calc((15 - 10) / 40 * 100%);width:calc(5 / 40 * 100%);background:var(--ok);opacity:.35;border-radius:4px;pointer-events:none}
.hrange{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
.hrange::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--pri) var(--p,12.5%),var(--ln2) var(--p,12.5%))}
.hrange::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--pri) var(--p,12.5%),var(--ln2) var(--p,12.5%))}
.hrange::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--pri);margin-top:-7px;box-shadow:0 2px 6px rgba(52,48,61,.2)}
.hrange::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--pri)}
/* ===== 프로토타입 셸 (원본 화면 바깥만) ===== */
html,body{height:100%}
body{padding:0;background:var(--canvas);overflow:hidden}
.stage{display:flex;align-items:center;justify-content:center;gap:44px;height:100vh;height:100dvh;padding:20px}
.device{width:375px;height:790px;border-radius:30px;border:1px solid #DBD7E2;box-shadow:0 30px 70px -24px rgba(52,48,61,.35);overflow:hidden;position:relative;background:var(--bg);flex:none;isolation:isolate}
#view{position:absolute;inset:0;overflow:hidden}
.page{position:absolute;inset:0;background:var(--bg);will-change:transform}
.page>.ph{width:100%;height:100%;border:0;border-radius:0;box-shadow:none;max-width:none}
.page .sc{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.page .sc::-webkit-scrollbar{display:none}

/* 인터랙션 표시 */
.hot{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s,transform .15s}
.hot:active{opacity:.72;transform:scale(.985)}
.btn.hot:active{transform:scale(.98)}
.flash .hot,.showhot .hot{outline:2px solid rgba(101,85,143,.55);outline-offset:-2px}
.flash .hot{animation:hf .7s ease}
@keyframes hf{0%,100%{outline-color:rgba(101,85,143,0)}30%{outline-color:rgba(101,85,143,.6)}}
.dis{opacity:.4;pointer-events:none}
.tg{transition:background .2s}.tg::after{transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tg.on{background:var(--pri)}.tg.on::after{transform:translateX(18px)}
.swapAnim{animation:sw .35s cubic-bezier(.2,.8,.2,1)}
@keyframes sw{from{transform:translateY(var(--dy,0))}}
.scanning{animation:scan 1s ease-in-out infinite}
@keyframes scan{50%{box-shadow:0 0 0 14px rgba(101,85,143,.12)}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.qr{transition:opacity .25s}

/* 전환 */
.enter-fwd{animation:inR .34s cubic-bezier(.2,.8,.2,1) both}
.leave-fwd{animation:outL .34s cubic-bezier(.2,.8,.2,1) both}
.enter-back{animation:inL .34s cubic-bezier(.2,.8,.2,1) both}
.leave-back{animation:outR .34s cubic-bezier(.2,.8,.2,1) both;z-index:3}
.enter-fade{animation:fin .24s ease both}
.leave-fade{animation:fout .2s ease both}
.enter-up{animation:inU .38s cubic-bezier(.2,.8,.2,1) both;z-index:3}
.leave-down{animation:outD .34s cubic-bezier(.4,0,.6,1) both;z-index:3}
@keyframes inR{from{transform:translateX(100%)}}
@keyframes outL{to{transform:translateX(-28%);opacity:.6}}
@keyframes inL{from{transform:translateX(-28%);opacity:.6}}
@keyframes outR{to{transform:translateX(100%)}}
@keyframes fin{from{opacity:0}}
@keyframes fout{to{opacity:0}}
@keyframes inU{from{transform:translateY(100%)}}
@keyframes outD{to{transform:translateY(100%)}}

/* 토스트 · 푸시 알림 · 데모 시트 */
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:80;background:rgba(52,48,61,.94);color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:500;line-height:20px;display:flex;gap:10px;align-items:center;transform:translateY(16px);opacity:0;transition:.28s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.on{transform:none;opacity:1}
.toast .ico-sm{color:var(--onpri);flex-shrink:0}
.push{position:absolute;left:10px;right:10px;top:10px;z-index:90;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(52,48,61,.18);display:flex;gap:12px;align-items:center;transform:translateY(-130%);transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.push{opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility .45s}
.push.on{transform:none;opacity:1;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .2s}
.push .ap{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:-.03em;flex-shrink:0}
.scrim{position:absolute;inset:0;z-index:95;background:rgba(52,48,61,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.dsheet{position:absolute;left:0;right:0;bottom:0;z-index:96;background:var(--sec);border-radius:22px 22px 0 0;padding:22px 20px 28px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dsheet.on{transform:none}
.dsheet .demo{display:inline-block;font-size:11px;font-weight:600;color:var(--pri);background:var(--sub);border-radius:6px;padding:2px 7px;margin-bottom:10px}

/* 가이드 패널 (PC) */
.guide{width:300px;height:min(790px,100%);display:flex;flex-direction:column;gap:12px;flex:none}
.g-br{display:flex;align-items:baseline;gap:10px}
.g-br b{font-size:24px;font-weight:680;color:var(--pri);letter-spacing:-.04em}
.g-br span{font-size:13px;color:var(--tx2)}
.g-card{background:var(--sec);border-radius:16px;padding:16px 18px}
.g-lbl{font-size:12px;font-weight:600;color:var(--pri);letter-spacing:.04em;margin-bottom:8px}
.g-list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin}
.g-grp{font-size:11px;font-weight:600;color:var(--tx3);margin:12px 0 4px}
.g-grp:first-child{margin-top:0}

  <div class="faq rv">
    <details><summary>당첨되면 결국 되팔지 않을까요?</summary><p>앱 안에는 되팔 길이 없어요. 동반자 양도와 정가 반환만 있고, 입장은 본인 얼굴로 켜지는 QR로만 해요. 국내에서 추첨제가 반대에 부딪힌 가장 큰 이유였어요. <a class="src" href="https://isplus.com/article/view/isp202506010076" target="_blank" rel="noopener">관련 보도: 2025년 추첨제 공약 철회</a></p></details>
    <details><summary>좌석이 무작위면 원하는 자리에 못 앉지 않나요?</summary><p>원하는 구역 순서를 정해 응모하고, 1순위 구역부터 배정을 시도해요.</p></details>
    <details><summary>매크로로 응모하면 어떻게 되나요?</summary><p>속도가 결과에 영향을 주지 않아서 매크로로 얻을 게 없어요. 계정도 통신사 인증으로 한 사람에 하나뿐이라, 계정을 여러 개 만들어 확률을 올릴 수도 없어요.</p></details>
    <details><summary>오래된 팬만 유리한 구조 아닌가요?</summary><p>등급 가중치는 최대 +10%로 묶여 있고, 신규 팬 몫은 따로 추첨해요. 이제 막 팬이 된 사람도 충분히 당첨될 수 있어요.</p></details>
    <details><summary>공연장 입구에서는 얼굴을 어떻게 확인하나요?</summary><p>입구 앞에서 내 폰으로 얼굴을 확인하면 3분 동안만 입장 QR이 켜져요. 게이트는 QR만 찍어요. QR은 15초마다 바뀌어서 캡처로는 들어갈 수 없어요.</p></details>
    <details><summary>얼굴 정보는 어디에 저장되나요?</summary><p>얼굴은 내 기기 안에서만 대조하고 원본을 서버에 보내거나 저장하지 않아요. 서버에는 본인 확인이 됐다는 결과만 남아요.</p></details>
    <details><summary>추첨을 조작할 수는 없나요?</summary><p>추첨 전에 무작위 번호를 봉인해 미리 공개하고, 마감 후 봉인을 열어 그 번호로 순서를 한 번만 정해요. 중간에 번호를 바꾸면 봉인이 맞지 않아 들통나고, 누구나 공개된 번호로 결과를 다시 계산해 볼 수 있어요.</p></details>
    <details><summary>갑자기 못 가게 되면요?</summary><p>예매 때 등록한 동반자에게 넘기거나 정가 100%로 반환할 수 있어요. 반환한 자리는 대기 팬에게 자동으로 넘어가요.</p></details>
    <details><summary>가족이나 친구와 같이 가고 싶어요.</summary><p>응모권이 2장 이상이면 연석으로 응모해요. 함께 갈 사람은 예매할 때 검증된 계정으로 등록하고, 입장은 각자 얼굴로 해요. 동반자로 등록된 사람은 그 회차에 따로 응모할 수 없어서, 당첨 기회를 두 번 쓰는 일이 없어요.</p></details>
  </div>

const first=CFG.screen;
if(first&&document.getElementById('s-'+first)){cur=first;stack=['05'];render(null)}else{cur='01';render(null)}
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='tick-go'||!document.getElementById('s-'+d.screen)||d.screen===cur)return;
 if(d.screen==='10'){S.mode=d.mode||'focus';S.n=2;S.compList=['minji_p'];S.comps=1}stack=['05'];cur=d.screen;render('fade')});
window.TICKarrive=function(f){const ar=document.getElementById('arrive');ar.style.display='';ar.className='';void ar.offsetWidth;ar.className='arrive-'+f;document.body.classList.add('arrive-anim');setTimeout(()=>{ar.style.display='none';ar.className='';document.body.classList.remove('arrive-anim')},1100)};
if(FROM)window.TICKarrive(FROM);

/* ---------- 휴대폰 안내 창 ---------- */
(function(){const B=document.body,tip=document.getElementById('gtip');
 const open=()=>{B.classList.add('gopen');tip.classList.remove('on');try{localStorage.setItem('tick-gtip','1')}catch(e){}};
 const close=()=>B.classList.remove('gopen');
 document.getElementById('gfab').addEventListener('click',open);
 document.getElementById('gscrim').addEventListener('click',close);
 document.getElementById('gclose').addEventListener('click',close);
 tip.addEventListener('click',open);
 document.getElementById('glist').addEventListener('click',e=>{if(e.target.closest('[data-j]'))close()});
 document.getElementById('ghot').addEventListener('click',()=>{if(B.classList.contains('mobile'))setTimeout(close,150)});
 document.getElementById('greset').addEventListener('click',close);
 document.getElementById('gback').addEventListener('click',close);
 let seen=false;try{seen=localStorage.getItem('tick-gtip')==='1'}catch(e){}
 if(!seen&&!EMBED){setTimeout(()=>{if(B.classList.contains('mobile')&&!B.classList.contains('gopen')){tip.classList.add('on');setTimeout(()=>tip.classList.remove('on'),5000)}},1800)}
})();

</script>

<!-- ======================= 화면 전환 · [소개 페이지] 스크립트 ======================= -->
<script>
(function(){
var html=document.documentElement,introRoot=null,appRoot=null;
var cssIntro=document.getElementById('css-intro'),cssApp=document.getElementById('css-app');

/* 소개 페이지 속 폰 미리보기: 같은 파일의 앱을 iframe 안에 그대로 띄움 (주소·서버 없이도 동작) */
function embedDoc(screen){
  return '<!DOCTYPE html><html lang="ko" data-mode="app"><head><meta charset="utf-8"><meta name="viewport" content="width=375">'
   +'<script>window.TICK_CFG={app:true,embed:true,screen:"'+screen+'"}<\/script>'
   +document.getElementById('font').outerHTML
   +'<style>'+document.getElementById('css-base').textContent+'</style>'
   +'<style>'+cssApp.textContent+'</style></head><body>'
   +document.getElementById('tpl-app').innerHTML
   +'<script>'+document.getElementById('js-app').textContent+'<\/script></body></html>';
}

function setMode(m){html.dataset.mode=m;cssIntro.disabled=(m!=='intro');cssApp.disabled=(m!=='app');
  document.title=m==='app'?'TICK 프로토타입':'TICK · 선착순이 끝나는 곳';
  document.querySelector('meta[name=theme-color]').content=m==='app'?'#F7F6F9':'#14121A';
  try{history.replaceState(null,'',location.pathname+(m==='app'?'?app=1':(html.classList.contains('present')?'?present=1':'')))}catch(e){}}

/* 앱을 미리 숨겨서 준비해 두면 전환 순간에 끊김이 없어요 */
function mountApp(){
  if(appRoot)return;
  document.body.appendChild(document.getElementById('tpl-app').content.cloneNode(true));appRoot=document.getElementById('app-root');
  if(html.dataset.mode!=='app')appRoot.hidden=true;
  TICK_CFG.from=null;var s=document.createElement('script');s.textContent=document.getElementById('js-app').textContent;document.body.appendChild(s);
  document.getElementById('gback').addEventListener('click',function(e){e.preventDefault();var b=e.currentTarget.getBoundingClientRect();go('intro')});
}
function showApp(){
  setMode('app');if(introRoot)introRoot.hidden=true;window.scrollTo(0,0);
  mountApp();appRoot.hidden=false;
  window.dispatchEvent(new Event('resize'));
}
function showIntro(){
  setMode('intro');if(appRoot)appRoot.hidden=true;
  if(!introRoot){document.body.appendChild(document.getElementById('tpl-intro').content.cloneNode(true));introRoot=document.getElementById('intro-root');initIntro()}
  else{introRoot.hidden=false;resetIntro()}
  window.scrollTo(0,0);fitPhones();
}

/* ===== 화면 전환: 티켓을 찢으면 → 서서히 암흑 → 프로토타입이 입체적으로 떠오름 ===== */
var xf=document.getElementById('xfade'),busy=false;
function setX(c){xf.className=c}
function go(mode){
  if(busy)return;busy=true;
  var swap=function(){mode==='app'?showApp():showIntro()};
  var stageIn=function(){var st=mode==='app'?document.querySelector('#app-root .stage'):document.querySelector('#intro-root .hero');
    if(st){st.classList.remove('enter');void st.offsetWidth;st.classList.add('enter');setTimeout(function(){st.classList.remove('enter')},2600)}};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){swap();busy=false;return}
  var after2=function(fn){requestAnimationFrame(function(){requestAnimationFrame(fn)})};
  setX('on notrans');void xf.offsetWidth;
  setX('on dark');                                         // 서서히 암흑
  setTimeout(function(){
    swap();
    after2(function(){
      stageIn();                                           // 어둠 속에서 입체적으로 떠오름
      setTimeout(function(){setX('on reveal')},mode==='app'?250:0);
      setTimeout(function(){setX('');busy=false},1700);
    });
  },mode==='app'?1050:800);                               // 암흑에 잠깐 머묾
}

/* ===== [소개 페이지] 폰 미리보기 크기 맞춤 ===== */
function fitPhones(){document.querySelectorAll('#intro-root .pf-s').forEach(function(s){var f=s.querySelector('iframe');if(f&&s.clientWidth)f.style.transform='scale('+(s.clientWidth/375)+')'})}
var going=false;
function resetIntro(){if(window.deckGo)window.deckGo(0,true);going=false;document.querySelectorAll('.tkt.tear').forEach(function(t){t.classList.remove('tear')})}


/* ===== 전시용 넘겨보기 (?present=1): 방향키 · 클릭 · 스와이프 · 자동 넘김 ===== */
function initDeck(){
  if(!html.classList.contains('present'))return;
  var deck=document.getElementById('deck'),sl=[].slice.call(deck.querySelectorAll('.dk')),i=0,auto=false,idleT=null,cycT=null;
  var dots=document.getElementById('dkDots');dots.innerHTML=sl.map(function(_,k){return '<button aria-label="'+(k+1)+'번째 장"></button>'}).join('');
  var fr=document.getElementById('dkFrame'),steps=[].slice.call(document.querySelectorAll('#dkSteps li')),si=0;
  function stepTo(k){si=k;steps.forEach(function(x,j){x.classList.toggle('on',j===k)});try{fr.contentWindow.postMessage({type:'tick-go',screen:steps[k].dataset.s},'*')}catch(e){}}
  steps.forEach(function(x,k){x.addEventListener('click',function(e){e.stopPropagation();stepTo(k);clearInterval(cycT)})});
  function show(n,instant){n=Math.max(0,Math.min(sl.length-1,n));sl.forEach(function(x,k){x.classList.toggle('on',k===n);x.classList.toggle('before',k<n)});
    [].forEach.call(dots.children,function(d,k){d.classList.toggle('on',k===n)});i=n;
    clearInterval(cycT);if(sl[n].classList.contains('dk-phone')){fitPhones();stepTo(0);cycT=setInterval(function(){stepTo((si+1)%steps.length)},3200)}
    arm()}
  window.deckGo=show;
  function arm(){clearTimeout(idleT);if(auto)idleT=setTimeout(function(){show(i>=sl.length-1?0:i+1)},8000)}
  function next(){show(i+1)}function prev(){show(i-1)}
  document.getElementById('dkNext').onclick=function(e){e.stopPropagation();next()};
  document.getElementById('dkPrev').onclick=function(e){e.stopPropagation();prev()};
  [].forEach.call(dots.children,function(d,k){d.onclick=function(e){e.stopPropagation();show(k)}});
  var ab=document.getElementById('dkAuto');ab.onclick=function(e){e.stopPropagation();auto=!auto;ab.classList.toggle('on',auto);ab.textContent=auto?'자동 넘김 켬':'자동 넘김 끔';arm()};
  if(new URLSearchParams(location.search).get('auto')==='1')ab.click();
  document.getElementById('dkFull').onclick=function(e){e.stopPropagation();try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}};
  document.getElementById('dkScroll').onclick=function(e){e.preventDefault();location.href=location.pathname};
  addEventListener('keydown',function(e){if(html.dataset.mode!=='intro'||(e.target.closest&&e.target.closest('.tkt')))return;
    if(['ArrowRight','PageDown',' '].indexOf(e.key)>-1){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].indexOf(e.key)>-1){e.preventDefault();prev()}else if(e.key==='Home')show(0);else if(e.key==='End')show(sl.length-1)});
  deck.addEventListener('click',function(e){if(e.target.closest('button,a,.tkt,.pf,.dk-bar,li'))return;(e.clientX<innerWidth*.3)?prev():next()});
  var sx=null;deck.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  deck.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){dx<0?next():prev()}sx=null});
  show(0);
}
/* ===== [소개 페이지] 스크롤 등장 · 숫자 카운트 · 티켓 절취 전환 ===== */
function initIntro(){
  var pres=html.classList.contains('present');document.querySelectorAll('#intro-root iframe[data-embed-screen]').forEach(function(f){if(!!f.closest('#deck')!==pres)return;f.srcdoc=embedDoc(f.dataset.embedScreen)});
  if('ResizeObserver' in window){var ro=new ResizeObserver(fitPhones);document.querySelectorAll('#intro-root .pf-s').forEach(function(s){ro.observe(s)})}
  addEventListener('resize',fitPhones);fitPhones();
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;e.target.classList.add('in');
    var n=e.target.querySelector('[data-count]');if(n)countUp(n);io.unobserve(e.target)})},{threshold:.2});
  document.querySelectorAll('#intro-root .rv').forEach(function(el){io.observe(el)});
  function countUp(el){var to=+el.dataset.count,sm=el.querySelector('small').outerHTML,t0=performance.now();
    (function f(t){var p=Math.min(1,(t-t0)/1200),v=Math.round(to*(1-Math.pow(1-p,3)));el.innerHTML=v+sm;if(p<1)requestAnimationFrame(f)})(t0)}
  function enter(el){if(going)return;going=true;var r=el.querySelector('.stub').getBoundingClientRect();
    el.classList.add('tear');
    setTimeout(function(){go('app')},260)}
  document.querySelectorAll('#intro-root [data-enter]').forEach(function(el){
    el.addEventListener('click',function(){enter(el)});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();enter(el)}});
  });
  initExtra();initDeck();
  document.querySelectorAll('#intro-root .cmp button').forEach(function(b){b.addEventListener('click',function(){
    var on=b.dataset.lm==='1';html.classList.toggle('lm',on);
    document.querySelectorAll('#intro-root .cmp button').forEach(function(x){x.classList.toggle('on',x===b)})})});
  if(document.querySelector('#intro-root .cmp'))html.classList.add('lm');
  document.querySelectorAll('#intro-root [data-open-app]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var b=a.getBoundingClientRect();go('app')})});
}

/* ===== [소개 페이지] 내비 · 계산기 · 화면 둘러보기 ===== */
function initExtra(){
  var nav=document.getElementById('snav'),hero=document.querySelector('#intro-root .hero');
  var links=[].slice.call(nav.querySelectorAll('.links a'));
  function onScroll(){nav.classList.toggle('on',scrollY>hero.offsetHeight-80);
    var cur=null;links.forEach(function(a){var sec=document.querySelector(a.getAttribute('href'));if(sec&&sec.getBoundingClientRect().top<innerHeight*.4)cur=a});
    links.forEach(function(a){a.classList.toggle('on',a===cur)})}
  addEventListener('scroll',onScroll,{passive:true});onScroll();
  links.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var t=document.querySelector(a.getAttribute('href'));if(t)t.scrollIntoView({behavior:'smooth'})})});
  function fill(r){r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min)*100+'%')}
  var br=document.getElementById('bitR');
  function bits(){var v=+br.value,t=v>=300?3:v>=100?2:1;fill(br);
    document.getElementById('bitV').textContent=v;document.getElementById('bitT').textContent=t+'장';
    document.querySelectorAll('#bitCalc .steps3>div').forEach(function(d){d.classList.toggle('on',+d.dataset.k<=t)});
    if(t<3){document.getElementById('bitNL').textContent='다음 장까지';document.getElementById('bitN').textContent=((t===1?100:300)-v)+'비트'}
    else{var ex=v-300;document.getElementById('bitNL').textContent='시즌 후 틱 전환';document.getElementById('bitN').textContent=(Math.round(ex*.02*10)/10)+'틱'}
    document.getElementById('bitX').innerHTML=t<3?'300비트를 넘기면 초과분의 2%가 시즌 후 틱으로 바뀌어요.':'초과 <b>'+(v-300)+'비트</b>의 2%가 틱으로 바뀌어요. 이벤트 기간이면 3%인 '+(Math.round((v-300)*.03*10)/10)+'틱.'}
  br.addEventListener('input',bits);bits();
  var tr=document.getElementById('tickR');
  function tick(){var v=+tr.value,k=v>=450?2:v>=200?1:0;fill(tr);
    document.getElementById('tickV').textContent=v;document.getElementById('tierN').textContent=['스파크','펄스','비컨'][k];
    var w=Math.round(v/600*100)/10;document.getElementById('tierW').textContent='+'+(w%1?w.toFixed(1):w)+'%';
    document.getElementById('tierM').textContent='= ×'+(1+.1*v/600).toFixed(3).replace(/0$/,'');
    document.querySelectorAll('#tierCalc .tiers>div').forEach(function(d){d.classList.toggle('on',+d.dataset.t===k)})}
  tr.addEventListener('input',tick);tick();
  var fr=document.getElementById('tourFrame');
  document.querySelectorAll('#tourTabs button').forEach(function(b){b.addEventListener('click',function(){
    document.querySelectorAll('#tourTabs button').forEach(function(x){x.classList.toggle('on',x===b)});
    var m={type:'tick-go',screen:b.dataset.s};if(b.dataset.s==='10')m.mode='seats';
    try{fr.contentWindow.postMessage(m,'*')}catch(e){}})});
}
addEventListener('pageshow',resetIntro);

if(html.dataset.mode==='app')showApp();else{showIntro();var pre=function(){mountApp()};('requestIdleCallback' in window)?requestIdleCallback(pre,{timeout:2500}):setTimeout(pre,1500)}
})();
</script>
</body>
